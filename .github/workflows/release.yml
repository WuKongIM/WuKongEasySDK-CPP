name: Prebuilt SDK archives
on:
  push:
    branches: ['codex/prebuilt-sdk']
    tags: ['v*']
    paths:
      - 'scripts/**'
      - 'examples/prebuilt-consumer/**'
      - 'docs/PREBUILT.md'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'examples/prebuilt-consumer/**'
      - 'docs/PREBUILT.md'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the CMake version from main only after every archive passes acceptance
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: prebuilt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: macos-14
            triplet: arm64-osx
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'CC=gcc-13' >> "$GITHUB_ENV"
          echo 'CXX=g++-13' >> "$GITHUB_ENV"
      - name: Prepare pinned vcpkg
        shell: bash
        run: |
          git init "$RUNNER_TEMP/prebuilt-vcpkg"
          git -C "$RUNNER_TEMP/prebuilt-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/prebuilt-vcpkg" fetch --depth 1 origin 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$RUNNER_TEMP/prebuilt-vcpkg" checkout --detach FETCH_HEAD
          if [ "$RUNNER_OS" = Windows ]; then
            cmd.exe //c "$(cygpath -w "$RUNNER_TEMP/prebuilt-vcpkg/bootstrap-vcpkg.bat") -disableMetrics"
          else
            "$RUNNER_TEMP/prebuilt-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/prebuilt-vcpkg" >> "$GITHUB_ENV"
      - name: Build and seal archives
        shell: bash
        env:
          VCPKG_MAX_CONCURRENCY: 2
          RELEASE_REF: ${{ github.ref }}
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          tag_args=()
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            tag_args=(--tag "${RELEASE_REF#refs/tags/}")
          fi
          python scripts/prebuilt.py --triplet '${{ matrix.triplet }}' "${tag_args[@]}"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prebuilt-${{ matrix.triplet }}
          path: |
            build/dist/*.zip
            build/dist/*.sha256
            build/dist/RELEASE_NOTES.md
            build/dist/RELEASE_VERSION.txt
          if-no-files-found: error
          retention-days: 14
  accept:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: macos-14
            triplet: arm64-osx
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: prebuilt-${{ matrix.triplet }}
          path: download
      - name: Verify and relocate archive
        shell: python
        run: |
          import hashlib, os, pathlib, zipfile
          root = pathlib.Path('download')
          archives = list(root.glob('*.zip'))
          assert len(archives) == 1
          archive = archives[0]
          expected, filename = archive.with_suffix('.sha256').read_text().split()
          assert filename == archive.name
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'relocated SDK'
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  assert (destination / name).resolve().is_relative_to(destination.resolve())
              z.extractall(destination)
          bundle = destination / archive.stem
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SDK_BUNDLE=' + str(bundle) + '\n')
      - name: Prepare acceptance dependencies
        shell: bash
        run: |
          python -m pip install -r "$SDK_BUNDLE/tests/requirements.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
          fi
      - name: Install the pinned product Go toolchain
        if: runner.os != 'Windows'
        uses: actions/setup-go@fba3fb4ead8c8e09a06f1d32ae5436e5818eff15
        with:
          go-version: '1.25.11'
          cache: false
      - name: Build pinned product server on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GOWORK: 'off'
        run: |
          git init "$RUNNER_TEMP/product-server"
          git -C "$RUNNER_TEMP/product-server" remote add origin https://github.com/WuKongIM/WuKongIM.git
          git -C "$RUNNER_TEMP/product-server" fetch --depth 1 origin 132e46209d98fa0425cc0f88e7a97080cdad044d
          git -C "$RUNNER_TEMP/product-server" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/product-server"
          go build -o "$RUNNER_TEMP/wukongim" ./cmd/wukongim
      - name: Consume archive in Debug and Release
        shell: bash
        run: |
          server_args=()
          if [ "$RUNNER_OS" != Windows ]; then
            server_args=(--server "$RUNNER_TEMP/wukongim")
          fi
          python "$SDK_BUNDLE/tests/accept_prebuilt.py" --bundle "$SDK_BUNDLE" "${server_args[@]}"
  publish:
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: [build, accept]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          pattern: prebuilt-*
          path: dist
          merge-multiple: true
      - name: Check exact asset set and checksums
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, zipfile
          root = pathlib.Path('dist')
          version = (root / 'RELEASE_VERSION.txt').read_text().strip()
          assert re.fullmatch(r'0|[1-9][0-9]*', version.split('.')[0])
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          names = {f'WuKongEasySDK-CPP-{version}-{p}.zip' for p in
              ('linux-x64-gcc13', 'macos-arm64-appleclang', 'windows-x64-msvc143-md')}
          assert {p.name for p in root.glob('*.zip')} == names
          lines = []
          for name in sorted(names):
              archive = root / name
              expected, filename = archive.with_suffix('.sha256').read_text().split()
              assert filename == name
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
              with zipfile.ZipFile(archive) as z:
                  info = json.loads(z.read(archive.stem + '/BUILD_INFO.json'))
                  assert info['packaging_commit'] == os.environ['GITHUB_SHA']
                  assert info['version'] == version
              lines.append(expected + '  ' + name)
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_TAG=v' + version + '\n')
      - name: Publish accepted SDK version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_args=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            existing=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG")
            if [ -n "$existing" ]; then
              echo 'Refusing to replace an existing release tag.' >&2
              exit 1
            fi
            tag_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS "${tag_args[@]}" --title "WuKongEasySDK-CPP $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
