name: C++ SDK validation
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libssl-dev nlohmann-json3-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install boost openssl@3 nlohmann-json
      - name: Install test dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWUKONG_INTEGRATION_TESTS=ON -DPython3_EXECUTABLE="$(command -v python)"
      - name: Prepare pinned vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --detach 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check install and downstream consumer
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/build/install"
          cmake -S tests/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$PWD/build/install" ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_MANIFEST_DIR="$PWD"' || '' }}
          cmake --build build/consumer --config Release --parallel 2
      - name: Prepare pinned vcpkg on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git init "$RUNNER_TEMP/wukong-vcpkg"
          git -C "$RUNNER_TEMP/wukong-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/wukong-vcpkg" fetch --depth 1 origin 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$RUNNER_TEMP/wukong-vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/wukong-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/wukong-vcpkg" >> "$GITHUB_ENV"
      - name: Consume published vcpkg registry in Debug and Release
        env:
          VCPKG_MAX_CONCURRENCY: 2
        run: python tests/check_vcpkg.py --triplet ${{ runner.os == 'Windows' && 'x64-windows' || runner.os == 'macOS' && 'arm64-osx' || 'x64-linux' }}
